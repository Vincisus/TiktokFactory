<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TiktokFactory — Voce e video</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d0d14;color:#eee;margin:0;padding:24px}
main{max-width:760px;margin:auto;background:#161622;padding:24px;border-radius:16px}
h1{font-size:22px;margin-top:0}
input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #333}
input{width:100%;box-sizing:border-box;background:#0d0d14;color:#eee}
button{background:#ffd166;color:#111;border:0;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
button:disabled{opacity:.5;cursor:not-allowed}
#status{white-space:pre-wrap;background:#0d0d14;border-radius:8px;padding:12px;margin-top:16px;max-height:360px;overflow:auto}
.error{color:#ff8080}
.ok{color:#8fd694}
</style>
</head>
<body>
<main>
<h1>Genera voce e video dal progetto salvato</h1>
<p>Inserisci il nome della cartella del progetto in <code>projects</code>, poi premi il pulsante. Non rigenera la storia.</p>
<label for="project">ID progetto</label>
<input id="project" placeholder="per esempio 20261112_124609_abcdef">
<label for="clips">Clip TikTok</label>
<input id="clips" type="number" min="3" max="4" value="4">
<button id="start">Genera voce e video</button>
<div id="status">In attesa.</div>
</main>
<script>
const status=document.getElementById("status");
const button=document.getElementById("start");
let timer=null;
function show(text,cls=""){status.className=cls;status.textContent=text}
button.onclick=async()=>{
  const projectId=document.getElementById("project").value.trim();
  const clips=Number(document.getElementById("clips").value||4);
  if(!projectId){show("Inserisci l'ID del progetto.","error");return}
  button.disabled=true;
  show("Avvio generazione voce e video…");
  try{
    const response=await fetch("/api/resume-media",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({project_id:projectId,tiktok_clips:clips})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.detail||"Avvio non riuscito");
    timer=setInterval(()=>follow(data.job_id),2000);
  }catch(error){show("Errore: "+error.message,"error");button.disabled=false}
};
async function follow(jobId){
  try{
    const response=await fetch("/api/jobs/"+jobId);
    const job=await response.json();
    if(!response.ok)throw new Error(job.detail||"Stato non disponibile");
    const logs=(job.logs||[]).join("\n");
    show("Stato: "+job.status+"\nAvanzamento: "+job.progress+"%\nFase: "+(job.current_step||"")+"\n\n"+logs+(job.error?"\n\nErrore: "+job.error:""));
    if(job.status==="completed"){clearInterval(timer);button.disabled=false;show("Completato.\n\nVideo: "+job.result.youtube_video+"\nClip TikTok:\n"+job.result.tiktok_clips.join("\n"),"ok")}
    if(job.status==="failed"){clearInterval(timer);button.disabled=false}
  }catch(error){clearInterval(timer);button.disabled=false;show("Errore: "+error.message,"error")}
}
</script>
</body>
</html>
